[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mucky"
version = "0.1.0"
description = "A terminal MUCK/MUD client with tabbed connections, mouse support, ANSI color and per-character logging."
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0",
    "PyYAML>=6.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mucky = "mucky.__main__:main"

[tool.setuptools.packages.find]
include = ["mucky*"]

[tool.setuptools.package-data]
mucky = ["web/*"]
