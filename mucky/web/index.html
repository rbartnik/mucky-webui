<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mucky</title>
  <link rel="stylesheet" href="static/style.css">
  <script type="module" src="static/app.js"></script>
</head>
<body>
  <header id="bar">
    <nav id="tabs" role="tablist" aria-label="Characters"></nav>
    <div id="open-wrap">
      <button id="open-btn" type="button" title="Open a character" aria-haspopup="menu">+</button>
      <div id="open-menu" role="menu" hidden></div>
    </div>
    <span id="link" title="Connection to the mucky server"></span>
  </header>

  <main id="outputs" aria-live="off"></main>
  <div id="empty" hidden>No characters open. Use <b>+</b> or type <code>/connect name</code>.</div>

  <div id="notices" aria-live="polite"></div>

  <form id="input-form" autocomplete="off">
    <textarea id="input" rows="1" spellcheck="false" autocapitalize="off"
              placeholder="Type a command, or /help" aria-label="Command input"></textarea>
  </form>

  <dialog id="login">
    <form method="dialog" id="login-form">
      <h1>mucky</h1>
      <label for="token">Server token</label>
      <input id="token" type="password" autocomplete="current-password" required>
      <label class="check"><input id="remember" type="checkbox" checked> Remember on this device</label>
      <p id="login-error" role="alert"></p>
      <button type="submit">Attach</button>
    </form>
  </dialog>
</body>
</html>
